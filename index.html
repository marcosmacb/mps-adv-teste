<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPS Advogados - Gestão (Supabase Real)</title>
    <!-- Importando o cliente real do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Estilos básicos limpos e modernos */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; color: #333; }
        .container { max-width: 800px; margin: 50px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        
        /* Formulários e Botões */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #004D4D; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #003333; }
        button.danger { background-color: #dc3545; }
        button.danger:hover { background-color: #c82333; }
        
        /* Tabelas */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #001A1A; color: white; }
        
        /* Alertas */
        .alert { padding: 15px; margin-bottom: 20px; border-radius: 4px; }
        .alert.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        
        /* Header do Dashboard */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #C9A769; padding-bottom: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="container">
        <h2>Acesso ao Sistema | MPS</h2>
        <div id="login-alert" class="alert hidden"></div>
        <form id="login-form">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="admin@mps.test">
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" required placeholder="admin123">
            </div>
            <button type="submit">Entrar</button>
        </form>
    </div>

    <!-- TELA PRINCIPAL (DASHBOARD) -->
    <div id="dashboard-screen" class="container hidden">
        <div class="header">
            <h2>Gestão de Clientes</h2>
            <div>
                <span id="user-info" style="margin-right: 15px; font-weight: bold;"></span>
                <button id="btn-logout" class="danger">Sair</button>
            </div>
        </div>

        <div id="dashboard-alert" class="alert hidden"></div>

        <!-- Formulário para Adicionar Cliente -->
        <div style="background: #f9f9f9; padding: 15px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #eee;">
            <h3>Adicionar Novo Cliente</h3>
            <form id="add-client-form" style="display: flex; gap: 10px; align-items: flex-end;">
                <div class="form-group" style="flex: 1; margin-bottom: 0;">
                    <label for="client-name">Nome / Razão Social</label>
                    <input type="text" id="client-name" required>
                </div>
                <div class="form-group" style="flex: 1; margin-bottom: 0;">
                    <label for="client-email">E-mail</label>
                    <input type="email" id="client-email" required>
                </div>
                <button type="submit" style="height: 40px;">Salvar Cliente</button>
            </form>
        </div>

        <!-- Tabela de Clientes -->
        <table id="clients-table">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="clients-tbody">
                <tr><td colspan="4">Carregando dados...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- LÓGICA DO SISTEMA -->
    <script>
        // =========================================================================
        // 1. CONFIGURAÇÃO DO SUPABASE (COLE SUAS CREDENCIAIS REAIS AQUI)
        // =========================================================================
        const SUPABASE_URL = 'https://brllgaxcmfwldchpflnk.supabase.co/rest/v1/'; 
        const SUPABASE_KEY = 'sb_publishable_NKvnzMEoWLzP22LwcIsNkw_99TU8MvL';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Estado da aplicação
        let currentUser = null;

        // Elementos DOM
        const loginScreen = document.getElementById('login-screen');
        const dashboardScreen = document.getElementById('dashboard-screen');
        const loginAlert = document.getElementById('login-alert');
        const dashboardAlert = document.getElementById('dashboard-alert');
        const clientsTbody = document.getElementById('clients-tbody');

        // =========================================================================
        // 2. FUNÇÕES DE UTILIDADE
        // =========================================================================
        function showMessage(element, message, type) {
            element.textContent = message;
            element.className = `alert ${type}`;
            element.classList.remove('hidden');
            setTimeout(() => element.classList.add('hidden'), 4000);
        }

        // =========================================================================
        // 3. AUTENTICAÇÃO (LOGIN MOCK VIA TABELA USUÁRIOS)
        // =========================================================================
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // Consulta real no seu banco Supabase
                const { data: users, error } = await supabase
                    .from('usuários')
                    .select('*')
                    .eq('email', email)
                    .eq('password', password);

                if (error) throw error;

                if (users && users.length > 0) {
                    currentUser = users[0];
                    document.getElementById('user-info').textContent = `Olá, ${currentUser.name}`;
                    
                    // Transição de tela
                    loginScreen.classList.add('hidden');
                    dashboardScreen.classList.remove('hidden');
                    
                    // Carrega os dados reais
                    loadClients();
                } else {
                    showMessage(loginAlert, 'E-mail ou senha incorretos.', 'error');
                }
            } catch (err) {
                console.error("Erro no login:", err);
                showMessage(loginAlert, 'Erro ao conectar com o banco de dados.', 'error');
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            currentUser = null;
            document.getElementById('login-form').reset();
            dashboardScreen.classList.add('hidden');
            loginScreen.classList.remove('hidden');
        });

        // =========================================================================
        // 4. CRUD DE CLIENTES (LENDO E GRAVANDO NO SUPABASE REAL)
        // =========================================================================
        
        // --- Ler (Read) ---
        async function loadClients() {
            try {
                const { data: clients, error } = await supabase
                    .from('clients')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) throw error;

                clientsTbody.innerHTML = ''; // Limpa a tabela

                if (clients.length === 0) {
                    clientsTbody.innerHTML = '<tr><td colspan="4">Nenhum cliente cadastrado.</td></tr>';
                    return;
                }

                clients.forEach(client => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${client.name}</td>
                        <td>${client.email}</td>
                        <td>${client.status}</td>
                        <td>
                            <button class="danger" onclick="deleteClient(${client.id})">Excluir</button>
                        </td>
                    `;
                    clientsTbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Erro ao carregar clientes:", err);
                showMessage(dashboardAlert, 'Erro ao listar clientes.', 'error');
            }
        }

        // --- Criar (Create) ---
        document.getElementById('add-client-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nameInput = document.getElementById('client-name');
            const emailInput = document.getElementById('client-email');

            try {
                const { data, error } = await supabase
                    .from('clients')
                    .insert([
                        { name: nameInput.value, email: emailInput.value, status: 'ativo' }
                    ]);

                if (error) throw error;

                showMessage(dashboardAlert, 'Cliente adicionado com sucesso!', 'success');
                nameInput.value = '';
                emailInput.value = '';
                loadClients(); // Recarrega a tabela

            } catch (err) {
                console.error("Erro ao inserir cliente:", err);
                showMessage(dashboardAlert, 'Erro ao salvar cliente.', 'error');
            }
        });

        // --- Deletar (Delete) ---
        // A função precisa ser global (window) para funcionar no onclick do HTML injetado
        window.deleteClient = async function(id) {
            if (!confirm('Tem certeza que deseja excluir este cliente?')) return;

            try {
                const { error } = await supabase
                    .from('clients')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                showMessage(dashboardAlert, 'Cliente excluído com sucesso.', 'success');
                loadClients(); // Atualiza a tabela
            } catch (err) {
                console.error("Erro ao deletar cliente:", err);
                showMessage(dashboardAlert, 'Erro ao excluir o cliente.', 'error');
            }
        };

    </script>
</body>
</html>
