<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPS Advogados - LexGuardian</title>
    
    <!-- Bibliotecas Externas -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-dark: #001A1A;
            --primary-gold: #C9A769;
            --bg-color: #f8f9fc;
            --text-dark: #333;
            --text-light: #fff;
            --card-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); margin: 0; padding: 0; color: var(--text-dark); }
        .hidden { display: none !important; }
        
        /* HEADER */
        .topbar { background-color: var(--primary-dark); color: var(--text-light); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .topbar .logo { font-size: 1.2rem; font-weight: bold; letter-spacing: 1px; color: var(--primary-gold); }
        .topbar .user-actions { display: flex; gap: 20px; align-items: center; font-size: 0.9rem; }
        .btn-logout { background: transparent; border: 1px solid var(--primary-gold); color: var(--primary-gold); padding: 5px 15px; border-radius: 4px; cursor: pointer; transition: 0.3s; }
        .btn-logout:hover { background: var(--primary-gold); color: var(--primary-dark); }

        /* NAVEGAÇÃO DE ABAS */
        .nav-tabs { display: flex; gap: 20px; padding: 0 30px; margin-top: 20px; border-bottom: 2px solid #e0e0e0; }
        .tab-btn { background: none; border: none; padding: 10px 20px; font-size: 1rem; color: #666; cursor: pointer; font-weight: 600; border-bottom: 3px solid transparent; transition: 0.3s; }
        .tab-btn:hover { color: var(--primary-dark); }
        .tab-btn.active { color: var(--primary-dark); border-bottom-color: var(--primary-gold); }

        /* CONTAINERS GERAIS */
        .container { padding: 30px; max-width: 1200px; margin: 0 auto; }
        
        /* CARDS KPI (DASHBOARD) */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .kpi-card { background: white; padding: 25px; border-radius: 8px; box-shadow: var(--card-shadow); border-top: 4px solid var(--primary-gold); text-align: center; }
        .kpi-card h2 { font-size: 2.5rem; margin: 0 0 10px 0; color: var(--primary-dark); }
        .kpi-card p { margin: 0; color: #666; font-size: 0.9rem; }

        /* LAYOUT DE GRÁFICOS */
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .chart-card { background: white; padding: 20px; border-radius: 8px; box-shadow: var(--card-shadow); }
        .chart-card h3 { text-align: center; margin-top: 0; color: var(--primary-dark); }

        /* TABELAS */
        .data-table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: var(--card-shadow); }
        .data-table th { background: var(--primary-dark); color: white; padding: 15px; text-align: left; }
        .data-table td { padding: 15px; border-bottom: 1px solid #eee; }
        .data-table tbody tr:hover { background-color: #f1f1f1; }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .badge-ativo { background: #d4edda; color: #155724; }
        .badge-inativo { background: #f8d7da; color: #721c24; }
        
        /* BOTÕES DE AÇÃO */
        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-primary { background: var(--primary-gold); color: var(--primary-dark); border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-primary:hover { background: #b5955b; }
        .search-box { padding: 10px; border: 1px solid #ddd; border-radius: 4px; width: 300px; }

        /* LOGIN */
        .login-wrapper { display: flex; justify-content: center; align-items: center; height: 100vh; background: var(--primary-dark); }
        .login-box { background: white; padding: 40px; border-radius: 8px; width: 100%; max-width: 400px; text-align: center; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .login-box button { width: 100%; }
        
        .alert { padding: 10px; margin-bottom: 15px; border-radius: 4px; display: none; }
        .alert.error { display: block; background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="login-wrapper">
        <div class="login-box">
            <h2 style="color: var(--primary-dark);">LEXGUARDIAN | MPS</h2>
            <p style="color: #666; margin-bottom: 20px;">Entre com suas credenciais</p>
            <div id="login-alert" class="alert"></div>
            <form id="login-form">
                <input type="email" id="email" required placeholder="E-mail">
                <input type="password" id="password" required placeholder="Senha">
                <button type="submit" class="btn-primary">Entrar <i class="fas fa-sign-in-alt"></i></button>
            </form>
        </div>
    </div>

    <!-- TELA PRINCIPAL (APP) -->
    <div id="app-screen" class="hidden">
        
        <!-- HEADER -->
        <header class="topbar">
            <div class="logo"><i class="fas fa-balance-scale"></i> LEXGUARDIAN | MPS</div>
            <div class="user-actions">
                <span><i class="fas fa-bell"></i></span>
                <span id="user-info">Administrador Geral</span>
                <button class="btn-logout" id="btn-logout"><i class="fas fa-sign-out-alt"></i> Sair</button>
            </div>
        </header>

        <!-- MENU DE ABAS -->
        <nav class="nav-tabs">
            <button class="tab-btn active" data-target="tab-dashboard"><i class="fas fa-chart-pie"></i> Dashboard</button>
            <button class="tab-btn" data-target="tab-clientes"><i class="fas fa-users"></i> Clientes</button>
            <button class="tab-btn" data-target="tab-relatorios"><i class="fas fa-chart-line"></i> Relatórios</button>
        </nav>

        <main class="container">
            
            <!-- ABA 1: DASHBOARD -->
            <section id="tab-dashboard" class="tab-content">
                <div class="kpi-grid">
                    <div class="kpi-card">
                        <h2 id="kpi-processos">...</h2>
                        <p>Total de Processos</p>
                    </div>
                    <div class="kpi-card">
                        <h2 id="kpi-clientes">...</h2>
                        <p>Clientes Ativos</p>
                    </div>
                    <div class="kpi-card">
                        <h2 id="kpi-prazos">4</h2>
                        <p>Prazos Próximos</p>
                    </div>
                    <div class="kpi-card">
                        <h2 id="kpi-audiencias">1</h2>
                        <p>Audiências Hoje</p>
                    </div>
                    <div class="kpi-card" style="border-top-color: #28a745;">
                        <h2 id="kpi-receita">R$ ...</h2>
                        <p>Receita Total (Pagos)</p>
                    </div>
                </div>
            </section>

            <!-- ABA 2: CLIENTES -->
            <section id="tab-clientes" class="tab-content hidden">
                <div class="action-bar">
                    <input type="text" class="search-box" id="search-client" placeholder="Buscar cliente por nome ou email...">
                    <button class="btn-primary" onclick="alert('Função de Modal de Cadastro será implementada aqui')"><i class="fas fa-plus"></i> Adicionar Cliente</button>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Telefone</th>
                            <th>CPF/CNPJ</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="clients-tbody">
                        <!-- Preenchido via JS -->
                    </tbody>
                </table>
            </section>

            <!-- ABA 3: RELATÓRIOS (CHART.JS) -->
            <section id="tab-relatorios" class="tab-content hidden">
                <div class="charts-grid">
                    <div class="chart-card">
                        <h3>Processos por Status</h3>
                        <canvas id="statusChart"></canvas>
                    </div>
                    <div class="chart-card">
                        <h3>Processos por Tipo</h3>
                        <canvas id="typeChart"></canvas>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- SCRIPTS E LÓGICA -->
    <script>
        // ==========================================
        // 1. CONFIGURAÇÃO SUPABASE
        // ==========================================
        const SUPABASE_URL = 'https://brllgaxcmfwldchpflnk.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_NKvnzMEoWLzP22LwcIsNkw_99TU8MvL';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ==========================================
        // 2. NAVEGAÇÃO DE ABAS
        // ==========================================
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Remove classe ativa de todos
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                
                // Adiciona classe ativa na aba clicada
                const targetId = e.currentTarget.getAttribute('data-target');
                e.currentTarget.classList.add('active');
                document.getElementById(targetId).classList.remove('hidden');

                // Renderiza gráficos caso a aba de relatórios seja aberta
                if(targetId === 'tab-relatorios') {
                    initCharts();
                }
            });
        });

        // ==========================================
        // 3. AUTENTICAÇÃO
        // ==========================================
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('login-alert');

            try {
                const { data: users, error } = await supabaseClient
                    .from('usuários')
                    .select('*')
                    .eq('email', email)
                    .eq('password', password);

                if (error) throw error;

                if (users && users.length > 0) {
                    document.getElementById('user-info').textContent = users[0].name;
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('app-screen').classList.remove('hidden');
                    
                    loadDashboardData();
                    loadClients();
                } else {
                    alertBox.textContent = 'Credenciais inválidas.';
                    alertBox.className = 'alert error';
                }
            } catch (err) {
                console.error(err);
                alertBox.textContent = 'Erro de conexão com o banco.';
                alertBox.className = 'alert error';
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            document.getElementById('login-form').reset();
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        });

        // ==========================================
        // 4. CARREGAMENTO DE DADOS (DASHBOARD)
        // ==========================================
        async function loadDashboardData() {
            // Conta processos
            const { count: countProcessos } = await supabaseClient
                .from('processos')
                .select('*', { count: 'exact', head: true });
            document.getElementById('kpi-processos').textContent = countProcessos || 0;

            // Conta clientes ativos
            const { count: countClientes } = await supabaseClient
                .from('clients')
                .select('*', { count: 'exact', head: true })
                .eq('status', 'ativo');
            document.getElementById('kpi-clientes').textContent = countClientes || 0;

            // Soma Receitas Pagas
            const { data: receitas } = await supabaseClient
                .from('financeiro')
                .select('value')
                .eq('type', 'honorario')
                .eq('status', 'pago');
            
            const totalReceita = receitas ? receitas.reduce((sum, item) => sum + item.value, 0) : 0;
            document.getElementById('kpi-receita').textContent = `R$ ${totalReceita.toLocaleString('pt-BR')}`;
        }

        // ==========================================
        // 5. LISTAGEM DE CLIENTES
        // ==========================================
        async function loadClients() {
            const { data: clients, error } = await supabaseClient
                .from('clients')
                .select('*')
                .order('name');

            if (error) {
                console.error(error); return;
            }

            const tbody = document.getElementById('clients-tbody');
            tbody.innerHTML = '';

            clients.forEach(c => {
                const tr = document.createElement('tr');
                const statusClass = c.status === 'ativo' ? 'badge-ativo' : 'badge-inativo';
                tr.innerHTML = `
                    <td><strong>${c.name}</strong></td>
                    <td>${c.email || '-'}</td>
                    <td>${c.phone || '-'}</td>
                    <td>${c.cpf || '-'}</td>
                    <td><span class="badge ${statusClass}">${c.status.toUpperCase()}</span></td>
                    <td>
                        <button style="border:none; background:transparent; color:#004D4D; cursor:pointer;" title="Editar"><i class="fas fa-edit"></i></button>
                        <button style="border:none; background:transparent; color:#dc3545; cursor:pointer;" title="Excluir"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Filtro de Clientes Local
        document.getElementById('search-client').addEventListener('input', (e) => {
            const termo = e.target.value.toLowerCase();
            const linhas = document.querySelectorAll('#clients-tbody tr');
            linhas.forEach(linha => {
                const nome = linha.children[0].textContent.toLowerCase();
                const email = linha.children[1].textContent.toLowerCase();
                if(nome.includes(termo) || email.includes(termo)) {
                    linha.style.display = '';
                } else {
                    linha.style.display = 'none';
                }
            });
        });

        // ==========================================
        // 6. INICIALIZAÇÃO DOS GRÁFICOS (CHART.JS)
        // ==========================================
        let statusChartInstance = null;
        let typeChartInstance = null;

        async function initCharts() {
            // Busca dados reais dos processos no Supabase para os gráficos
            const { data: processos } = await supabaseClient.from('processos').select('status, tipo_processo');
            
            if(!processos) return;

            // Agrupa por status
            const statusCounts = processos.reduce((acc, p) => {
                acc[p.status] = (acc[p.status] || 0) + 1;
                return acc;
            }, {});

            // Agrupa por tipo
            const typeCounts = processos.reduce((acc, p) => {
                acc[p.tipo_processo] = (acc[p.tipo_processo] || 0) + 1;
                return acc;
            }, {});

            // RENDERIZA GRÁFICO 1: STATUS (Doughnut)
            if(statusChartInstance) statusChartInstance.destroy();
            const ctxStatus = document.getElementById('statusChart').getContext('2d');
            statusChartInstance = new Chart(ctxStatus, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(statusCounts),
                    datasets: [{
                        data: Object.values(statusCounts),
                        backgroundColor: ['#C9A769', '#004D4D', '#D4EDDA', '#E2E3E5']
                    }]
                }
            });

            // RENDERIZA GRÁFICO 2: TIPO (Pie)
            if(typeChartInstance) typeChartInstance.destroy();
            const ctxType = document.getElementById('typeChart').getContext('2d');
            typeChartInstance = new Chart(ctxType, {
                type: 'pie',
                data: {
                    labels: Object.keys(typeCounts),
                    datasets: [{
                        data: Object.values(typeCounts),
                        backgroundColor: ['#004D4D', '#C9A769', '#002B2B', '#D4B989']
                    }]
                }
            });
        }
    </script>
</body>
</html>
